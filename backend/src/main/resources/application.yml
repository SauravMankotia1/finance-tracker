server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: finance-tracker
  
  datasource:
    # Uses PostgreSQL if SPRING_DATASOURCE_URL / DATABASE_URL is set (Neon / Render),
    # otherwise defaults to local in-memory H2 database with PostgreSQL compatibility mode.
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false

# Custom Application Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info
