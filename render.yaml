services:
  - type: web
    name: finflow-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false # Set to your Neon PostgreSQL JDBC URL (e.g. jdbc:postgresql://ep-...neon.tech/neondb?sslmode=require)
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # Set to your Neon DB username
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # Set to your Neon DB password
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173,https://*.vercel.app
      - key: H2_CONSOLE_ENABLED
        value: false
