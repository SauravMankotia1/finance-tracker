services:
  - type: web
    name: finflow-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false # Set from Supabase in Render Dashboard
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # e.g. postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # your Supabase password
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://*.vercel.app
